<div class="page-layout carded fullwidth tabbed inner-scroll" id="patients">

    <!-- TOP BACKGROUND -->
    <div class="top-bg accent"></div>
    <!-- / TOP BACKGROUND -->

    <!-- CENTER -->
    <div class="center">

        <!-- CONTENT CARD -->
        <div class="content-card">

            <!-- CONTENT -->

            <!--<nav mat-tab-nav-bar>-->
            <!--<a (click)="activeLink = 'main'"-->
            <!--[active]="activeLink === 'main'"-->
            <!--[routerLink]="['main']"-->
            <!--mat-tab-link>-->
            <!--Main Queue-->
            <!--</a>-->
            <!--<a (click)="activeLink = 'mine'"-->
            <!--[active]="activeLink === 'mine'"-->
            <!--[routerLink]="['mine']"-->
            <!--mat-tab-link>-->
            <!--My Queue-->
            <!--</a>-->
            <!--<a (click)="activeLink = 'current'"-->
            <!--[active]="activeLink === 'current'"-->
            <!--[routerLink]="['current']"-->
            <!--mat-tab-link>-->
            <!--Current-->
            <!--</a>-->
            <!--</nav>-->
            <mat-tab-group (selectedTabChange)="tabChanged($event)" [selectedIndex]="activetabindex"
                fusePerfectScrollbar>
                <mat-tab>
                    <ng-template matTabLabel>
                        <span [matBadge]="mainQueue" matBadgeColor="warn" matBadgeOverlap="false"
                            matBadgePosition="above after">Main Queue</span>
                    </ng-template>
                    <ng-template matTabContent>
                        <div class="tab-content p-24" fusePerfectScrollbar>
                            <queue-main></queue-main>
                        </div>
                    </ng-template>
                </mat-tab>

                <mat-tab>
                    <ng-template matTabLabel>
                        <span [matBadge]="myQueue" matBadgeColor="warn" matBadgeOverlap="false"
                            matBadgePosition="above after">My Queue</span>
                    </ng-template>
                    <ng-template matTabContent>
                        <div class="tab-content p-24" fusePerfectScrollbar>
                            <queue-mine></queue-mine>
                        </div>
                    </ng-template>
                </mat-tab>

                <mat-tab [disabled]="!currentpatient">
                    <ng-template matTabLabel>
                        <span class="pill" [ngClass]="{'activepill': currentpatient}">
                            Current Patient
                        </span>
                    </ng-template>

                    <ng-template matTabContent>
                        <div class="tab-content p-24">
                            <patient-current></patient-current>
                        </div>
                    </ng-template>
                </mat-tab>
            </mat-tab-group>
            <!-- / CONTENT -->
        </div>
        <!-- / CONTENT CARD -->

    </div>
    <!-- / CENTER -->

</div>
