<div>
    <!-- <button mat-raised-button (click)="viewhistory()">HISTORY</button>
    <button mat-raised-button color="accent" (click)="save()">SAVE</button> -->
    <br>
    <form [formGroup]="tempMedinfo" class=" p-24 m-24" *ngIf="init">
        <mat-form-field appearance="outline" class="subheading-2 ">
            <mat-label>Blood Pressure</mat-label>
            <input matInput required formControlName="pressure">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>
        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Haemoglobin</mat-label>
            <input matInput required formControlName="hb">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Heart Rate</mat-label>
            <input matInput required formControlName="heartRate">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Sugar</mat-label>
            <input matInput required formControlName="sugar">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Weight</mat-label>
            <input matInput required formControlName="weight">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Height</mat-label>
            <input matInput required formControlName="height">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>BMI</mat-label>
            <input matInput disabled=required [value]="tempMedinfo?.controls.height">
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>
    </form>
</div>
