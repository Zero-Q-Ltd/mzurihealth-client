<div>
    <!-- <button mat-raised-button (click)="viewhistory()">HISTORY</button>
    <button mat-raised-button color="accent" (click)="save()">SAVE</button> -->
    <br>
    <form *ngIf="init" [formGroup]="tempMedinfo" class=" p-24 m-24">
        <mat-form-field appearance="outline" class="subheading-2 ">
            <mat-label>Blood Pressure</mat-label>
            <input formControlName="pressure" matInput required>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>
        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Haemoglobin</mat-label>
            <input formControlName="hb" matInput required>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Heart Rate</mat-label>
            <input formControlName="heartRate" matInput required>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Sugar</mat-label>
            <input formControlName="sugar" matInput required>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Weight</mat-label>
            <input formControlName="weight" matInput required>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>Height</mat-label>
            <input formControlName="height" matInput required>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>

        <mat-form-field appearance="outline" class="subheading-2  ">
            <mat-label>BMI</mat-label>
            <input [value]="tempMedinfo?.controls.height" disabled=required matInput>
            <mat-icon class="secondary-text" matSuffix>title</mat-icon>
        </mat-form-field>
        <br>
    </form>
</div>
