<div class="page-layout simple ">

    <div class="content" fxLayout="column">
        <div fxLayout="row">
            <general-details class="cardlike mat-elevation-z6" fxFlex="50"></general-details>
            <patient-history class="cardlike mat-elevation-z6" fxFlex="50"></patient-history>
        </div>

        <div fxLayout="row">
            <div class="cardlike mat-elevation-z6" fxFlex="25">
                <mat-chip-list aria-label="Component selection">
                    <mat-chip (click)="activechip = 'General'" [selected]="activechip === 'General'" color="accent">
                        General
                    </mat-chip>
                    <mat-chip (click)="activechip = 'Conditions'" [selected]="activechip === 'Conditions'"
                              color="accent">Conditions
                    </mat-chip>
                    <mat-chip (click)="activechip = 'Allergies'" [selected]="activechip === 'Allergies'" color="accent">
                        Allergies
                    </mat-chip>
                    <mat-chip (click)="savemedinfo()" color="accent" selected>
                        SAVE
                    </mat-chip>
                </mat-chip-list>
                <div [ngSwitch]="activechip">
                    <app-med-info *ngSwitchCase="'General'"></app-med-info>
                    <app-conditions *ngSwitchCase="'Conditions'"></app-conditions>
                    <app-allergies *ngSwitchCase="'Allergies'"></app-allergies>

                </div>

            </div>
            <app-perform-procedure class="cardlike mat-elevation-z6" fxFlex="75"></app-perform-procedure>
        </div>

    </div>
</div>
